# CI — tanpa CD: build, lint, test, coverage. Deploy manual via VPS.
name: ci

on:
  push:
    branches: [main, fix]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_DB: postgresql://127.0.0.1:5432/test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: pip install -r requirements.txt pytest pytest-cov
      - name: Syntax check
        run: python -m compileall -q app.py
      - name: Python compile scripts
        working-directory: .
        run: python -m compileall -q scripts/ backend/
      - name: Auto-pricing unit tests (scripts)
        working-directory: .
        run: python -B -m unittest scripts.tests.test_self_undercut -v
      - name: Run tests with coverage (logic >=80%, app smoke)
        run: pytest --cov=logic --cov=app --cov-report=term-missing -q
      - name: Coverage gate on pure logic
        run: pytest tests/test_logic.py --cov=logic --cov-report=term-missing --cov-fail-under=80 -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install
        run: npm ci || npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build